services:
  - type: web
    name: seguimiento-tickets
    runtime: node
    plan: free
    buildCommand: npm ci --omit=dev --no-audit --no-fund
    startCommand: node server.js
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
